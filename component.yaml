apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/authz
  name: Authorization
  version: 2.0.0
  description: Permission key catalogue, roles as plain unions, the policy bundle served at /authz/bundle, and login-time claims.
  repository: https://github.com/brickKit/infra-authz
  license: Apache-2.0
  vendor: brickKit

tags: [infra, authz, rbac]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/infra/authz/v1/authz.proto, contracts/events/authz.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/authz.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: []

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: infra_authz}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    PERMISSION_CATALOG: {type: string}
    ACCESS_TOKEN_TTL_SECONDS: {type: integer, default: 600}
    DEFAULT_ORG_ID: {type: string, default: "1"}
    BOOTSTRAP_ADMIN_SUB: {type: string, default: ""}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL, PERMISSION_CATALOG]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8223
  extraPorts:
    - {name: grpc, port: 9223}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 192Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]

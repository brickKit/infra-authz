apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/authz
  name: Authorization
  version: 3.0.17
  description: "The authorization member: definitions submitted by every component, security records changed only at the effect point (containment within the grantor's limit, the last admin), and views verified from the committed records"
  repository: https://github.com/brickKit/infra-authz

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8223
  extraPorts:
    - name: grpc
      port: 9223
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/infra-authz", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

configSchema:
  properties:
    AUDIT_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    AUTHZ_BOOTSTRAP_ADMIN:
      description: 'the install claim: the platform principal (UUIDv7) that becomes the first authorization admin of a member without any management; ignored afterwards'
      type: string
    AUTHZ_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    AUTHZ_INSTANCE:
      description: 'this member''s instance identity: generated once at installation (a UUID), kept with the deployment''s run files, never the same in two deployments; views carry it'
      type: string
    AUTHZ_REGISTRY:
      description: 'the registry''s owners of resource types and permission keys: TSV with kind (resource_type or permission), key, owner_component; generated by the assembly. Not sensitive: a secret key so that file:// delivers its content (or AUTHZ_REGISTRY_FILE)'
      secret: true
      type: string
    AUTHZ_SOURCE_HIGH:
      description: 'D_src_high (security 03, D64): a duration; default 1m, at most 5m. Views that depend on the identity source stop renewing high-risk operations past this watermark age; a duration (e.g. 2s, 500ms); SDK default 60s'
      type: string
    AUTHZ_SOURCE_READ:
      description: 'D_src_read (security 03, D64): a duration; default 10m, at most 1h, no shorter than AUTHZ_SOURCE_HIGH. Past this watermark age the views close for ordinary reads too; a duration (e.g. 2s, 500ms); SDK default 600s'
      type: string
    BUS_SUBSCRIPTION_CONCURRENCY:
      type: integer
    BUS_URL:
      description: 'process-level: the same for every member of a shell'
      secret: true
      type: string
    DEPLOYMENT_ID:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_COMPONENT:
      description: 'the identity member''s component ID, e.g. infra/iam-casdoor (config/vars.yaml): the certificate it presents and the name of the account status source'
      type: string
    IAM_GRPC_URL:
      description: 'the identity member''s system surface, $endpoint:<identity member>:grpc (config/vars.yaml): the account status is pulled and read there'
      type: string
    IAM_ISSUER:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_JWKS_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    LOG_LEVEL:
      description: SDK default info
      enum:
        - debug
        - info
        - warn
        - error
      type: string
    OBJECT_STORE_ACCESS_KEY:
      type: string
    OBJECT_STORE_BUCKET:
      type: string
    OBJECT_STORE_PREFIX:
      type: string
    OBJECT_STORE_REGION:
      description: SDK default us-east-1
      type: string
    OBJECT_STORE_SECRET_KEY:
      secret: true
      type: string
    OBJECT_STORE_URL:
      type: string
    OTEL_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    PG_DATABASE:
      type: string
    PG_HOST:
      type: string
    PG_IDLE_IN_TX_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 10s
      type: string
    PG_LOCK_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_PASSWORD:
      secret: true
      type: string
    PG_OWNER_USER:
      type: string
    PG_PASSWORD:
      secret: true
      type: string
    PG_POOL_BACKGROUND:
      description: SDK default 4
      type: integer
    PG_POOL_FOREGROUND:
      description: SDK default 8
      type: integer
    PG_POOLER_PREPARED:
      description: SDK default true
      type: boolean
    PG_PORT:
      description: SDK default 5432
      type: integer
    PG_SCHEMA:
      type: string
    PG_STATEMENT_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 5s
      type: string
    PG_USER:
      type: string
    SERVICE_TLS_CA_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_CERT_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_KEY_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    STOP_DRAIN_DELAY:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    STOP_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 30s
      type: string
  required:
    - AUTHZ_INSTANCE
    - AUTHZ_REGISTRY
    - BUS_URL
    - IAM_COMPONENT
    - IAM_GRPC_URL
    - PG_DATABASE
    - PG_HOST
    - PG_PASSWORD
    - PG_SCHEMA
    - PG_USER
  type: object
release:
  goModule: true

apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/authz
  name: Authorization
  version: 3.0.12
  description: "The authorization member: definitions submitted by every component, security records changed only at the effect point (containment within the grantor's limit, the last admin), and views verified from the committed records"
  repository: https://github.com/brickKit/infra-authz

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8223
  extraPorts:
    - name: grpc
      port: 9223
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/infra-authz", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

configSchema:
  type: object
  required:
  - AUTHZ_INSTANCE
  - AUTHZ_REGISTRY
  - DEPLOYMENT_ID
  - IAM_ISSUER
  - IAM_JWKS_URL
  - AUTHZ_GRPC_URL
  - SERVICE_TLS_CERT_FILE
  - SERVICE_TLS_KEY_FILE
  - SERVICE_TLS_CA_FILE
  - PG_HOST
  - PG_DATABASE
  - PG_USER
  - PG_PASSWORD
  - PG_SCHEMA
  properties:
    AUTHZ_INSTANCE:
      type: string
      description: 'this member''s instance identity: generated once at installation (a UUID), kept with the deployment''s run files, never the same in two deployments; views carry it'
    AUTHZ_REGISTRY:
      type: string
      secret: true
      description: 'the registry''s owners of resource types and permission keys: TSV with kind (resource_type or permission), key, owner_component; generated by the assembly. Not sensitive: a secret key
        so that file:// delivers its content (or AUTHZ_REGISTRY_FILE)'
    AUTHZ_BOOTSTRAP_ADMIN:
      type: string
      description: 'the install claim: the platform principal (UUIDv7) that becomes the first authorization admin of a member without any management; ignored afterwards'
    LOG_LEVEL:
      type: string
      enum:
      - debug
      - info
      - warn
      - error
      description: SDK default info
    OTEL_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    STOP_DRAIN_DELAY:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 2s
    STOP_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 30s
    DEPLOYMENT_ID:
      type: string
      description: 'process-level: the same for every member of a shell'
    IAM_ISSUER:
      type: string
      description: 'process-level: the same for every member of a shell'
    IAM_JWKS_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    AUTHZ_GRPC_URL:
      type: string
      description: 'this member''s own system surface ($endpoint:infra/authz:grpc): it guards its user surface with its own view'
    AUDIT_GRPC_URL:
      type: string
      description: 'process-level: the same for every member of a shell'
    SERVICE_TLS_CERT_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    SERVICE_TLS_KEY_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    SERVICE_TLS_CA_FILE:
      type: string
      secret: true
      mount: file
      description: a file path, re-read on rotation
    PG_HOST:
      type: string
    PG_PORT:
      type: integer
      description: SDK default 5432
    PG_DATABASE:
      type: string
    PG_USER:
      type: string
    PG_PASSWORD:
      type: string
      secret: true
    PG_SCHEMA:
      type: string
    PG_POOLER_PREPARED:
      type: boolean
      description: SDK default true
    PG_STATEMENT_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 5s
    PG_LOCK_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 2s
    PG_IDLE_IN_TX_TIMEOUT:
      type: string
      description: a duration (e.g. 2s, 500ms); SDK default 10s
    PG_POOL_FOREGROUND:
      type: integer
      description: SDK default 8
    PG_POOL_BACKGROUND:
      type: integer
      description: SDK default 4
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_USER:
      type: string
    PG_OWNER_PASSWORD:
      type: string
      secret: true

release:
  goModule: true

id: infra/authz                      # 必须与 component.yaml 一致，be-ops 校验

domain: infra
tier: backend

edge_routes:
  # ⚠️ /authz/bundle 刻意不出现在这里——它只在内网被各组件 be-sdk 轮询，
  # 不经网关暴露给最终用户。be-ops 产出 1（路由表）要跳过它，
  # 这里不声明就是最简单的跳过方式。
  - { path: /api/me/permissions, auth: required }
  - { path: /api/admin/**, auth: required }

menus:
  - { key: infra.authz, title: 权限与角色管理, permission: infra.authz.admin }

data:
  schema: infra_authz                 # registry/schemas.tsv
  role:   infra_authz_rw              # 登录角色，`PG_USER` 的值

data_scopes: none                     # 权限数据本身不做行级过滤：
                                       # 能进管理界面的人（infra.authz.admin）就能看全部，
                                       # 这是功能权限的事，不是数据权限的事

permissions:
  - { key: infra.authz.admin, title: 权限与角色管理, type: page }
